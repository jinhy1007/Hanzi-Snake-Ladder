<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Azure 读音评测检查</title>
<style>
body{margin:0;background:#ECE6FA;color:#2E2A4A;font-family:"PingFang SC",system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:4px 0 4px}p{color:#655F86;font-size:14px;margin:0 0 12px}
.panel{background:#FFFDFB;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 3px 0 #E3DAEC}
.step{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #F2ECFC;font-size:15px}
.step:last-child{border-bottom:none}.step b{width:22px;flex:none}.step small{display:block;color:#655F86;font-size:12px;word-break:break-all}
button{border:none;border-radius:14px;padding:11px 16px;font:inherit;cursor:pointer;background:#D9549B;color:#fff;box-shadow:0 3px 0 #A6386F}
button.soft{background:#F2ECFC;color:#2E2A4A;box-shadow:0 3px 0 #E3DAEC}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{font-family:"Kaiti SC",KaiTi,serif;font-size:30px;width:64px;text-align:center;border-radius:12px;border:2px solid #E3DAEC;padding:2px}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#F2ECFC;border-radius:10px;padding:8px;max-height:240px;overflow:auto}
</style>
</head>
<body>
<main>
  <h1>🔧 Azure 读音评测检查</h1>
  <p>一步一步检查游戏能不能用 Azure 给读音打分。请在 iPhone 的 Safari 里打开，用手机流量或家里的 Wi-Fi。</p>
  <section class="panel">
    <div class="row"><button id="go">① 检查连接</button></div>
    <div id="steps" style="margin-top:8px"></div>
  </section>
  <section class="panel">
    <div class="row"><span>读这个字：</span><input id="zi" value="大" maxlength="1"></div>
    <p style="margin:10px 0 6px">② 每个按钮都读一次「大」，看哪个有结果：</p>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <button data-v="A">A 🎤 打分（不设停顿时间）</button>
      <button data-v="B">B 🎤 打分 + 停顿时间（游戏现在用的）</button>
      <button data-v="C">C 🎤 只识别，不打分</button>
      <button data-v="E">E 🎤 打分（只看声母韵母，不细到音素）</button>
    </div>
    <p style="margin:10px 0 0">SDK 版本：<b id="ver"></b>　<a id="other" href="#">换另一个版本再试</a></p>
    <div id="res" style="margin-top:10px"></div>
  </section>
  <section class="panel">
    <div class="row"><button class="soft" id="copy">📋 复制结果发给 Claude</button></div>
    <pre id="log"></pre>
  </section>
</main>
<script>
const TOKEN_URL = 'https://hanzi-speech-token.jinhy1007.workers.dev';
const SDK_VER = new URLSearchParams(location.search).get('sdk') || '1.44.0';
const SDK_URL = `https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@${SDK_VER}/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js`;
const $ = id => document.getElementById(id);
const logs = [`页面：${location.href}`, `浏览器：${navigator.userAgent}`];
const log = m => { logs.push(`${(performance.now() / 1000).toFixed(1)}s ${m}`); $('log').textContent = logs.join('\n'); };
const step = (ok, title, detail) => { $('steps').insertAdjacentHTML('beforeend', `<div class="step"><b>${ok === null ? '⏳' : ok ? '✅' : '❌'}</b><div>${title}<small>${detail || ''}</small></div></div>`); log(`${ok ? 'OK' : 'FAIL'} ${title} ${detail || ''}`); };
let tok = null;

async function getToken(){
  const r = await fetch(TOKEN_URL, {cache: 'no-store'});
  const t = await r.text();
  if (!r.ok) throw new Error(`HTTP ${r.status}：${t.slice(0, 200)}`);
  const j = JSON.parse(t); if (!j.token) throw new Error('没有 token：' + t.slice(0, 200));
  return j;
}
function loadSdk(){
  return new Promise((res, rej) => {
    if (window.SpeechSDK) return res(window.SpeechSDK);
    const s = document.createElement('script'); s.src = SDK_URL;
    s.onload = () => window.SpeechSDK ? res(window.SpeechSDK) : rej(new Error('脚本加载了，但没有 SpeechSDK'));
    s.onerror = () => rej(new Error('脚本加载失败')); document.head.appendChild(s);
  });
}
$('go').onclick = async () => {
  $('steps').innerHTML = '';
  step(window.isSecureContext, '网页是 https', window.isSecureContext ? '' : '麦克风需要 https');
  step(!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), '浏览器可以用麦克风');
  try { tok = await getToken(); step(true, '拿到临时凭证（Worker → Azure）', `区域：${tok.region}，凭证长度 ${tok.token.length}`); }
  catch (e) { step(false, '拿临时凭证失败', String(e.message || e) + '（可能是网络挡住了 workers.dev，或 Worker 里的 AZURE_KEY / AZURE_REGION 不对）'); }
  try { const sdk = await loadSdk(); step(true, 'Azure 语音工具加载好了', 'SDK ' + (sdk.SpeechConfig ? 'OK' : '?')); }
  catch (e) { step(false, 'Azure 语音工具加载失败', String(e.message || e)); }
};
$('ver').textContent = SDK_VER;
$('other').href = '?sdk=' + (SDK_VER === '1.44.0' ? '1.48.0' : '1.44.0');
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => readVariant(b.dataset.v));
async function readVariant(variant){
  const ch = ($('zi').value || '大').trim().slice(0, 1), res = $('res');
  res.textContent = '准备中……';
  let sdk;
  try { sdk = await loadSdk(); if (!tok) tok = await getToken(); }
  catch (e) { res.textContent = '❌ 先要通过 ① 的检查：' + (e.message || e); log('read: ' + (e.message || e)); return; }
  try {
    const cfg = sdk.SpeechConfig.fromAuthorizationToken(tok.token, tok.region);
    cfg.speechRecognitionLanguage = 'zh-CN';
    if (variant === 'B'){
      cfg.setProperty(sdk.PropertyId.SpeechServiceConnection_InitialSilenceTimeoutMs, '6000');
      cfg.setProperty(sdk.PropertyId.SpeechServiceConnection_EndSilenceTimeoutMs, '700');
      cfg.setProperty(sdk.PropertyId.Speech_SegmentationSilenceTimeoutMs, '700');
    }
    const rec = new sdk.SpeechRecognizer(cfg, sdk.AudioConfig.fromDefaultMicrophoneInput());
    if (variant !== 'C'){
      const pa = new sdk.PronunciationAssessmentConfig(ch, sdk.PronunciationAssessmentGradingSystem.HundredMark,
        variant === 'E' ? sdk.PronunciationAssessmentGranularity.Word : sdk.PronunciationAssessmentGranularity.Phoneme, false);
      pa.applyTo(rec);
    }
    res.textContent = `🎤 [${variant}] 正在听，请读「${ch}」……`; log(`listen ${variant} ${ch} sdk ${SDK_VER}`);
    const t0 = performance.now();
    rec.recognizeOnceAsync(r => {
      const ms = Math.round(performance.now() - t0);
      const reason = sdk.ResultReason[r.reason];
      let out = `[${variant}] 结果：${reason}，听到「${r.text || ''}」，用了 ${ms}ms`;
      if (r.reason === sdk.ResultReason.RecognizedSpeech){
        try { const p = sdk.PronunciationAssessmentResult.fromResult(r); out += `\n准确度 ${p.accuracyScore}，发音分 ${p.pronunciationScore}，完整度 ${p.completenessScore}`;
          const w = p.detailResult && p.detailResult.Words && p.detailResult.Words[0]; if (w) out += `\n错误类型：${w.PronunciationAssessment && w.PronunciationAssessment.ErrorType}`; }
        catch (e) { out += '\n读分数出错：' + e.message; }
      } else if (r.reason === sdk.ResultReason.Canceled){
        const c = sdk.CancellationDetails.fromResult(r); out += `\n取消原因：${sdk.CancellationReason[c.reason]} ${c.errorCode || ''} ${c.errorDetails || ''}`;
      }
      res.textContent = out; log(out.replace(/\n/g, ' | ')); rec.close();
    }, err => { res.textContent = '❌ 出错：' + err; log(`[${variant}] error ` + err); rec.close(); });
  } catch (e) { res.textContent = '❌ 出错：' + (e.message || e); log(`[${variant}] exception ` + (e.message || e)); }
}
$('copy').onclick = async () => { try { await navigator.clipboard.writeText(logs.join('\n')); $('copy').textContent = '✅ 已复制'; } catch (e) { $('copy').textContent = '请长按下面的文字复制'; } };
log('ready');
</script>
</body>
</html>
